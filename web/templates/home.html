{{define "content"}}
<div class="card shadow-sm mb-4">
  <div class="card-body p-4">
    <h1 class="h4 mb-1">{{.T.Routes.Home}}</h1>
    <p class="text-body-secondary mb-0">
      {{if .Principal}}
        {{.T.Common.WelcomeUser}}{{.Principal.DisplayName}} ({{.Principal.Account}})
      {{else}}
        {{.T.Common.WelcomeSystem}}
      {{end}}
    </p>
  </div>
</div>

<div class="row g-3">
  {{range .NavItems}}
    {{if ne .Href "/"}}
      <div class="col-md-6 col-lg-4">
        <div class="card h-100 shadow-sm">
          <div class="card-body d-flex flex-column justify-content-between gap-3">
            <div>
              <h2 class="h5 card-title mb-1">{{.Label}}</h2>
              <p class="card-text text-body-secondary small mb-0">{{.Href}}</p>
            </div>
            <div>
              <a class="btn btn-outline-primary btn-sm" href="{{.Href}}">{{.Label}}</a>
            </div>
          </div>
        </div>
      </div>
    {{end}}
  {{end}}
</div>
{{end}}
